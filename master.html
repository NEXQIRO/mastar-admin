<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASTER ADMINISTRATOR</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="./firebase-config.js"></script>
<style>
:root{--bg:#0A0A0A;--card:#151310;--in:#1D1A14;--bd:#2E281C;--gold:#F59E0B;--bg2:#B97800;--tx:#F5EFE0;--mu:#A89F8A;--ok:#4ADE80;--er:#F87171}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--tx);font-family:'Hind Siliguri',sans-serif;font-size:14px}
.hd{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.hd h1{flex:1;font:700 20px Rajdhani;color:var(--gold);letter-spacing:1px}
.bal{border:1px solid var(--bg2);background:var(--in);color:var(--gold);border-radius:99px;padding:4px 14px;font:700 15px Rajdhani}
.w{max-width:1000px;margin:0 auto;padding:14px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}.cd b{display:block;font:700 22px Rajdhani;color:var(--gold)}.cd span{color:var(--mu);font-size:12px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
button,input,textarea,select{font-family:inherit;font-size:14px}
textarea{width:100%;background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;color:var(--tx);font-size:13px}
#tn{height:36px;background:var(--in);color:var(--gold);border:1px solid var(--bg2);border-radius:10px;padding:0 8px;font-weight:600;max-width:200px}
button{border:1px solid var(--bg2);background:var(--in);color:var(--gold);border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:600}
button.on,button.p{background:var(--gold);color:#0A0A0A}button.d{color:var(--er);border-color:#6b2a2a}button:disabled{opacity:.4}
input{height:42px;background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:0 12px;color:var(--tx);width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.row input{flex:1;min-width:140px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-size:12px}
.pl{padding:2px 9px;border-radius:99px;font-size:11px;border:1px solid #1f5b35;color:var(--ok)}.pl.b{border-color:#6b2a2a;color:var(--er)}.pl.y{border-color:var(--bg2);color:var(--gold)}
.sw{width:50px;height:26px;padding:0;border-radius:99px;position:relative;background:#3a1f1f;border-color:#6b2a2a;vertical-align:middle}.sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--er);transition:.2s}.sw.ok{background:#143d25;border-color:#1f5b35}.sw.ok::after{left:26px;background:var(--ok)}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}#login .cd{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
#login h1{font:700 22px Rajdhani;color:var(--gold);text-align:center}#app{display:none}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--in);border:1px solid var(--bg2);padding:10px 16px;border-radius:12px;display:none;z-index:99;max-width:90%}
</style></head><body>
<div id="login"><div class="cd"><h1 id="lt">MASTER ADMINISTRATOR</h1>
<input id="em" type="email" placeholder="Master ইমেইল"><input id="pw" type="password" placeholder="পাসওয়ার্ড">
<button class="p" onclick="login()">লগইন</button><button id="lback" style="display:none" onclick="switchTenant('main')">← মূল প্রজেক্টে ফিরুন</button></div></div>
<div id="app">
<div class="hd"><h1>👑 MASTER ADMINISTRATOR</h1><select id="tn" onchange="switchTenant(this.value)" title="প্রজেক্ট বদলান"></select><div class="bal" id="mb">৳ 0</div><button onclick="setMaster()">ব্যালেন্স সেট</button><button class="d" onclick="auth.signOut()">লগআউট</button></div>
<div class="w">
<div class="g"><div class="cd"><span>Master ব্যালেন্স</span><b id="s1">0</b></div><div class="cd"><span>অ্যাডমিনদের মোট ব্যালেন্স</span><b id="s2">0</b></div><div class="cd"><span>অ্যাডমিন সংখ্যা</span><b id="s3">0</b></div><div class="cd"><span>পেন্ডিং রিকোয়েস্ট</span><b id="s4">0</b></div></div>
<div class="tabs"><button id="t-admins" onclick="tab('admins')">User Admins</button><button id="t-reqs" onclick="tab('reqs')">ব্যালেন্স রিকোয়েস্ট</button><button id="t-led" onclick="tab('led')">লেজার</button><button id="t-games" onclick="tab('games')">গেম ম্যানেজমেন্ট</button><button id="t-players" onclick="tab('players')">প্লেয়ার</button><button id="t-act" onclick="tab('act')">গেম অ্যাক্টিভিটি</button><button id="t-feat" onclick="tab('feat')">ফিচার কন্ট্রোল</button><button id="t-tenants" onclick="tab('tenants')">🔥 প্রজেক্টসমূহ</button><button id="t-guide" onclick="tab('guide')">📖 গাইড</button></div>
<div id="v"></div></div></div><div id="toast"></div>
<script>
const MAINCFG=window.NP_FIREBASE_CONFIG,MAINAPP=firebase.initializeApp(MAINCFG),TS=firebase.database.ServerValue.TIMESTAMP;
let auth=MAINAPP.auth(),db=MAINAPP.database(),TID='main',TCFG=MAINCFG,TNAME='মূল প্রজেক্ট',LST=[],AUTHUNSUB=null;
const $=i=>document.getElementById(i),fmt=n=>'৳ '+Math.round(n||0).toLocaleString('en-US'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ADM={},REQ={},LED={},GAMES={},USERS={},ACT={},MB=0,cur='admins',started=false,Q='',FEAT={},SEL='',GV='',UAON=true,BON={};
const FL=[["tournaments", "পেজ", "টুর্নামেন্টসমূহ (পেজ)"], ["users", "পেজ", "প্লেয়ার / ইউজার (পেজ)"], ["wallet", "পেজ", "ওয়ালেট ও রিকোয়েস্ট (পেজ)"], ["finance", "পেজ", "আর্থিক রিপোর্ট / Finance (পেজ)"], ["notices", "পেজ", "নোটিশ ও ঘোষণা (পেজ)"], ["notifications", "পেজ", "ইউজার নোটিফিকেশন (পেজ)"], ["settings", "পেজ", "অ্যাপ সেটিংস (পেজ)"], ["audit", "পেজ", "রিপোর্ট ও অডিট লগ (পেজ)"], ["t_create", "টুর্নামেন্ট", "টুর্নামেন্ট তৈরি ও এডিট"], ["t_room", "টুর্নামেন্ট", "রুম আইডি/পাসওয়ার্ড দেওয়া ও পাবলিশ"], ["t_results", "টুর্নামেন্ট", "রেজাল্ট ও প্রাইজ বিতরণ"], ["t_delete", "টুর্নামেন্ট", "টুর্নামেন্ট ডিলিট"], ["u_ban", "প্লেয়ার", "প্লেয়ার ব্যান / সক্রিয় করা"], ["u_track", "প্লেয়ার", "প্লেয়ার ট্র্যাকিং (IP, ডিভাইস, অডিট)"], ["u_report", "প্লেয়ার", "প্লেয়ার আর্থিক রিপোর্ট ও CSV"], ["dep", "ওয়ালেট", "ডিপোজিট অনুমোদন / বাতিল"], ["wd", "ওয়ালেট", "উইথড্র সম্পন্ন / বাতিল"], ["bal_req", "ওয়ালেট", "Master-এর কাছে ব্যালেন্স রিকোয়েস্ট"], ["dep_bonus", "ওয়ালেট", "ডিপোজিটে বোনাস ও টার্নওভার সেট করা"], ["notice_pub", "নোটিশ", "নোটিশ পাবলিশ ও ডিলিট"], ["notif_send", "নোটিফিকেশন", "নোটিফিকেশন পাঠানো ও ডিলিট"], ["set_pay", "সেটিংস", "পেমেন্ট ও সোশ্যাল লিংক সেটিংস"], ["banners", "সেটিংস", "ব্যানার যোগ ও ডিলিট"]];
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}
async function login(){try{await auth.signInWithEmailAndPassword($('em').value.trim(),$('pw').value)}catch(e){toast('লগইন ব্যর্থ: '+e.message)}}
const on=(r,cb)=>{r.on('value',cb);LST.push(r)};
function attachAll(){
 on(db.ref('master/balance'),s=>{if(s.val()===null)db.ref('master/balance').set(0);MB=+s.val()||0;draw()});
 on(db.ref('admins'),s=>{ADM=s.val()||{};draw()});
 on(db.ref('balanceRequests').limitToLast(100),s=>{REQ=s.val()||{};draw()});
 on(db.ref('adminFeatures'),s=>{FEAT=s.val()||{};draw()});
on(db.ref('adminSettings/depositBonus'),s=>{BON=s.val()||{};draw()});
 on(db.ref('adminSettings/userAdminOn'),s=>{UAON=s.val()!==false;draw()});
 on(db.ref('games'),s=>{GAMES=s.val()||{};draw()});
 on(db.ref('users'),s=>{USERS=s.val()||{};draw()});
 on(db.ref('balanceLedger').limitToLast(100),s=>{LED=s.val()||{};draw()})}
function detachAll(){LST.forEach(r=>{try{r.off()}catch(e){}});LST=[];started=false;ADM={};REQ={};LED={};GAMES={};USERS={};ACT={};MB=0;FEAT={};SEL='';UAON=true;BON={}}
function bindAuth(){if(AUTHUNSUB)AUTHUNSUB();const my=TID;
 AUTHUNSUB=auth.onAuthStateChanged(async u=>{if(my!==TID)return;
  if(!u){$('lt').textContent=TID==='main'?'MASTER ADMINISTRATOR':'লগইন: '+TNAME;$('lback').style.display=TID==='main'?'none':'block';$('login').style.display='flex';$('app').style.display='none';return}
  const m=await db.ref('master/balance').once('value').catch(()=>null);if(my!==TID)return;
  if(!m){await auth.signOut();toast('এই অ্যাকাউন্টের Master অ্যাক্সেস নেই ('+TNAME+'): ওই প্রজেক্টে রুলস পাবলিশ ও Master ইউজার আছে কিনা দেখুন');return}
  $('login').style.display='none';$('app').style.display='block';
  if(started)return;started=true;attachAll();draw()})}
// ===== একাধিক Firebase প্রজেক্ট (টেন্যান্ট) =====
function getTenants(){try{return JSON.parse(localStorage.getItem('np_tenants')||'[]')}catch(e){return[]}}
function parseCfg(t){const g=k=>{const m=String(t).match(new RegExp('["\']?'+k+'["\']?\\s*:\\s*["\']([^"\']+)["\']'));return m?m[1].trim():''};
 const c={apiKey:g('apiKey'),authDomain:g('authDomain'),databaseURL:g('databaseURL'),projectId:g('projectId'),storageBucket:g('storageBucket'),messagingSenderId:g('messagingSenderId'),appId:g('appId')};
 if(!c.authDomain&&c.projectId)c.authDomain=c.projectId+'.firebaseapp.com';
 if(!c.databaseURL&&c.projectId)c.databaseURL='https://'+c.projectId+'-default-rtdb.firebaseio.com';
 Object.keys(c).forEach(k=>{if(!c[k])delete c[k]});return c}
function drawTn(){const sel=$('tn');if(!sel)return;const L=[['main','মূল প্রজেক্ট'],...getTenants().map(t=>[t.id,t.name])];
 sel.innerHTML=L.map(([id,n])=>`<option value="${esc(id)}"${id===TID?' selected':''}>${esc(n)}</option>`).join('')}
function switchTenant(id){if(id===TID){drawTn();return}
 const t=id==='main'?{id:'main',name:'মূল প্রজেক্ট',config:MAINCFG}:getTenants().find(x=>x.id===id);
 if(!t){toast('প্রজেক্ট পাওয়া যায়নি');drawTn();return}
 detachAll();TID=t.id;TNAME=t.name;TCFG=t.config;
 let app;try{if(t.id==='main')app=MAINAPP;else{const nm='t_'+t.id;app=firebase.apps.find(a=>a.name===nm)||firebase.initializeApp(t.config,nm)}}
 catch(e){toast('প্রজেক্টে সংযোগ ব্যর্থ: '+e.message);TID='main';TNAME='মূল প্রজেক্ট';TCFG=MAINCFG;app=MAINAPP}
 auth=app.auth();db=app.database();cur='admins';drawTn();bindAuth()}
function addTenant(){const name=$('tnm').value.trim(),c=parseCfg($('tcf').value);
 if(!name){toast('প্রজেক্টের নাম দিন');return}
 if(!c.apiKey||!c.projectId){toast('কনফিগে অন্তত apiKey ও projectId থাকতে হবে');return}
 const id=c.projectId.toLowerCase().replace(/[^a-z0-9]/g,'');const L=getTenants();
 if(!id||id==='main'||c.projectId===MAINCFG.projectId||L.some(x=>x.id===id)){toast('এই প্রজেক্ট আগে থেকেই যোগ করা আছে');return}
 L.push({id,name,config:c});try{localStorage.setItem('np_tenants',JSON.stringify(L))}catch(e){toast('সেভ করা যায়নি');return}
 $('tnm').value='';$('tcf').value='';toast('প্রজেক্ট যোগ হয়েছে ✅ এবার "খুলুন" চাপুন');drawTn();draw()}
function delTenant(id){if(!confirm('এই প্রজেক্ট তালিকা থেকে সরাবেন? (Firebase-এর কোনো ডেটা মুছবে না)'))return;
 localStorage.setItem('np_tenants',JSON.stringify(getTenants().filter(x=>x.id!==id)));if(TID===id)switchTenant('main');drawTn();draw()}
bindAuth();
function tab(t){cur=t;if(t==='act')loadAct();draw()}
async function loadAct(){try{const s=await db.ref('game_sessions').limitToLast(200).once('value');ACT=s.val()||{}}catch(e){toast('অ্যাক্টিভিটি লোড ব্যর্থ: '+e.message)}draw()}
async function saveGame(id){const g=id?GAMES[id]:{};
 const name=id?prompt('গেমের নাম:',g.name||''):$('gn').value.trim(),cat=id?prompt('ক্যাটাগরি (Popular Games / Crash Games):',g.category||'Popular Games'):$('gc').value,
 img=id?prompt('ছবির লিংক:',g.image||''):$('gi').value.trim(),url=id?prompt('গেমের লিংক:',g.url||''):$('gu').value.trim();
 if(!name||!img||!url){toast('সব তথ্য দিন');return}
 const k=id||db.ref('games').push().key,st=g.status||'Active';
 const d={id:k,name,category:cat,image:img,imageUrl:img,url,gameUrl:url,status:st,active:st==='Active',isActive:st==='Active',updatedAt:TS};if(!id)d.createdAt=TS;
 try{await db.ref('games/'+k).update(d);toast('গেম সংরক্ষিত ✅');if(!id)['gn','gi','gu'].forEach(i=>$(i).value='')}catch(e){toast('ব্যর্থ: '+e.message)}}
async function fSet(k,v){try{await db.ref('adminFeatures/'+k).set(v)}catch(e){toast('ব্যর্থ: '+e.message)}}
async function fAll(v){const o={};FL.forEach(([k])=>o[k]=v);try{await db.ref('adminFeatures').set(o);toast(v?'সব ফিচার চালু ✅':'সব ফিচার বন্ধ ⛔')}catch(e){toast('ব্যর্থ: '+e.message)}}
async function gToggle(id){const n=(GAMES[id].status||'Active')==='Active'?'Inactive':'Active';await db.ref('games/'+id).update({status:n,active:n==='Active',isActive:n==='Active',updatedAt:TS})}
async function gDel(id){if(confirm('"'+(GAMES[id].name||id)+'" মুছে ফেলবেন? ইউজার প্যানেল থেকেও মুছে যাবে।'))await db.ref('games/'+id).remove()}
async function uAdjust(uid){const u=USERS[uid]||{},a=parseFloat(prompt(`${u.name||uid} (ব্যালেন্স ৳${u.balance||0})\nযোগ করতে +50, কাটতে -50 লিখুন:`,'50'));if(!a)return;const why=prompt('কারণ:','ম্যানুয়াল সমন্বয়');if(!why)return;
 // টাকা কাটলে সেই টাকা ইউজারের অ্যাডমিনের অ্যাকাউন্টে ফেরত যাবে
 let adm=null;
 if(a<0){
  adm=u.adminUid&&ADM[u.adminUid]?u.adminUid:null;
  if(!adm){const L=Object.entries(ADM);
   if(L.length){const pick=prompt(`এই প্লেয়ারের অ্যাডমিন রেকর্ড করা নেই।\nকাটা ৳${-a} কোন অ্যাডমিনের অ্যাকাউন্টে ফেরত যাবে? নম্বর লিখুন\n(খালি রাখলে কোনো অ্যাডমিনকে ফেরত যাবে না, বাতিল চাপলে পুরো কাজ বন্ধ):\n\n`+L.map(([k,x],i)=>`${i+1}. ${x.name||x.email}`).join('\n'),'');
    if(pick===null)return;const n=parseInt(pick);if(n>=1&&n<=L.length)adm=L[n-1][0]}}
  if(adm&&!confirm(`৳${-a} প্লেয়ারের ব্যালেন্স থেকে কেটে "${ADM[adm].name||ADM[adm].email}" অ্যাডমিনের অ্যাকাউন্টে ফেরত যাবে। নিশ্চিত?`))return}
 let before=0;const ok=await tx(`users/${uid}/balance`,b=>{if(b===null)return 0;before=b;return b+a>=0?b+a:undefined});if(!ok){toast('ব্যালেন্স আপডেট হয়নি (ঋণাত্মক হয়ে যাবে)');return}
 if(adm){try{if(!await tx(`admins/${adm}/balance`,inc(-a)))throw 0}catch(e){await tx(`users/${uid}/balance`,inc(-a));toast('অ্যাডমিনকে ফেরত দেওয়া যায়নি, তাই কাটা বাতিল করা হয়েছে');return}
  try{await db.ref(`users/${uid}/adminUid`).set(adm)}catch(e){}

function parseTiers(txt){
 if(!txt)return [];
 const lines=txt.split('\n');
 const out=[];
 for(let l of lines){
  const parts=l.split(',').map(s=>s.trim());
  if(parts.length>=3){
   const min=parseFloat(parts[0]),bp=parseFloat(parts[1]),to=parseFloat(parts[2]);
   if(!isNaN(min)&&!isNaN(bp)&&!isNaN(to)&&min>0){
    out.push({minDeposit:min,bonusPercent:bp,turnoverMultiplier:to});
   }
  }
 }
 out.sort((a,b)=>a.minDeposit-b.minDeposit);
 return out;
}
function formatTiers(tiers){
 if(!Array.isArray(tiers)||!tiers.length)return '300, 3, 1\n500, 10, 3';
 return tiers.map(t=>`${t.minDeposit}, ${t.bonusPercent}, ${t.turnoverMultiplier}`).join('\n');
}
