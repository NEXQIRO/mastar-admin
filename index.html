<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXQIRO - লগইন</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0A0A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NEXQIRO">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="master-icon-192.png">
<link rel="icon" type="image/png" href="master-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0A; --card:#151310; --card-hover:#1D1A14; --line:#2E281C; --gold-line:#B97800;
  --primary:#F59E0B; --primary-hover:#FFAF1A; --glow:rgba(245,158,11,.35);
  --text:#F5EFE0; --muted:#A89F8A; --dim:#736B5E;
  --font-display:'Rajdhani',sans-serif; --font-body:'Hind Siliguri','Inter',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:
    radial-gradient(900px 500px at 50% -10%,rgba(245,158,11,.14),transparent 60%),
    radial-gradient(600px 400px at 100% 100%,rgba(185,120,0,.10),transparent 60%),
    var(--bg);
  color:var(--text);font-family:var(--font-body);
  display:flex;align-items:center;justify-content:center;
  padding:max(20px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom));
}
.wrap{width:100%;max-width:440px;text-align:center}
.logo{
  width:84px;height:84px;margin:0 auto 14px;border-radius:22px;overflow:hidden;
  border:1px solid var(--gold-line);background:var(--card);
  box-shadow:0 0 28px var(--glow);display:flex;align-items:center;justify-content:center;
}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.logo .fallback{font-family:var(--font-display);font-weight:700;font-size:38px;color:var(--primary)}
h1{font-family:var(--font-display);font-weight:700;font-size:34px;letter-spacing:6px;color:var(--primary);text-shadow:0 0 22px var(--glow)}
.sub{color:var(--muted);font-size:14px;margin:6px 0 26px}
.cards{display:grid;gap:14px}
.role{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;
  color:var(--text);font-family:inherit;transition:.18s ease;text-decoration:none;
}
.role:hover,.role:focus-visible{border-color:var(--gold-line);background:var(--card-hover);box-shadow:0 4px 22px rgba(245,158,11,.18);outline:none;transform:translateY(-1px)}
.role:active{transform:scale(.985)}
.ico{
  flex:0 0 52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#F59E0B,#B97800);color:#0A0A0A;
}
.ico svg{width:26px;height:26px}
.role.admin .ico{background:linear-gradient(145deg,#2E281C,#1D1A14);color:var(--primary);border:1px solid var(--gold-line)}
.txt{flex:1;min-width:0}
.txt b{display:block;font-family:var(--font-display);font-size:21px;letter-spacing:1.5px;font-weight:700}
.txt span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.arrow{color:var(--primary);font-size:22px;font-weight:700}
.badge{display:inline-block;font-size:11px;color:var(--primary);border:1px solid var(--gold-line);border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:middle;font-family:var(--font-body);letter-spacing:0}
.opts{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:12px}
.check{display:inline-flex;align-items:center;gap:9px;color:var(--muted);font-size:14px;cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--primary)}
.auto{
  display:none;color:var(--text);font-size:14px;background:var(--card);border:1px solid var(--gold-line);
  border-radius:14px;padding:12px 14px;width:100%;
}
.auto.show{display:block}
.auto button{margin-top:10px;background:transparent;border:1px solid var(--line);color:var(--primary);border-radius:10px;padding:8px 16px;font-family:inherit;font-size:14px;cursor:pointer}
.auto button:hover{border-color:var(--gold-line)}
.foot{margin-top:26px;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><img src="master-logo.png" alt="" onerror="this.remove();document.querySelector('.logo').insertAdjacentHTML('beforeend','<span class=fallback>N</span>')"></div>
  <h1>NEXQIRO</h1>
  <p class="sub">কোন প্যানেলে লগইন করবেন সিলেক্ট করুন</p>

  <div class="cards">
    <a class="role master" id="goMaster" href="master.html" data-role="master">
      <div class="ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18h18l-1.5-11-4.5 4-3-6-3 6-4.5-4z"/><path d="M4 21h16"/></svg>
      </div>
      <div class="txt"><b>MASTER<span class="badge" id="bMaster" hidden>শেষবার</span></b><span>মাস্টার অ্যাডমিন প্যানেল</span></div>
      <div class="arrow">›</div>
    </a>

    <a class="role admin" id="goAdmin" href="admin.html" data-role="admin">
      <div class="ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.3 8-8 9-4.7-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
      </div>
      <div class="txt"><b>ADMIN<span class="badge" id="bAdmin" hidden>শেষবার</span></b><span>অ্যাডমিন প্যানেল</span></div>
      <div class="arrow">›</div>
    </a>
  </div>

  <div class="opts">
    <div class="auto" id="auto">
      <span id="autoTxt"></span><br>
      <button type="button" id="cancelAuto">বাতিল করুন</button>
    </div>
    <label class="check"><input type="checkbox" id="remember"> পরের বার সরাসরি এই প্যানেলে খুলুন</label>
  </div>

  <div class="foot">NEXQIRO &middot; একই অ্যাপে Master ও Admin</div>
</div>

<script>
(function(){
  var KEY_LAST='nexqiro_last_role', KEY_AUTO='nexqiro_auto_open';
  var PAGES={master:'master.html',admin:'admin.html'};
  var NAMES={master:'Master',admin:'Admin'};
  var timer=null;

  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function del(k){try{localStorage.removeItem(k)}catch(e){}}

  var last=get(KEY_LAST); if(!PAGES[last]) last=null;
  var autoOn=get(KEY_AUTO)==='1';
  var rem=document.getElementById('remember');
  rem.checked=autoOn;

  // শেষবার যেটা খুলেছিলেন সেটার পাশে ব্যাজ
  if(last==='master') document.getElementById('bMaster').hidden=false;
  if(last==='admin')  document.getElementById('bAdmin').hidden=false;

  // কার্ডে ক্লিক করলে পছন্দ সেভ হবে
  Array.prototype.forEach.call(document.querySelectorAll('.role'),function(a){
    a.addEventListener('click',function(){
      var r=a.getAttribute('data-role');
      set(KEY_LAST,r);
      if(rem.checked) set(KEY_AUTO,'1'); else del(KEY_AUTO);
    });
  });
  rem.addEventListener('change',function(){
    if(rem.checked) set(KEY_AUTO,'1'); else del(KEY_AUTO);
  });

  // অটো-ওপেন: ?choose বা #choose থাকলে (বা প্যানেল থেকে ফিরে এলে) অটো যাবে না
  var forceChoose=/[?&]choose\b/.test(location.search)||location.hash==='#choose';
  if(autoOn&&last&&!forceChoose){
    var box=document.getElementById('auto'), txt=document.getElementById('autoTxt');
    var n=2;
    box.classList.add('show');
    (function tick(){
      txt.textContent=NAMES[last]+' প্যানেল খুলছে… '+n;
      if(n<=0){location.replace(PAGES[last]);return}
      n--; timer=setTimeout(tick,600);
    })();
    document.getElementById('cancelAuto').addEventListener('click',function(){
      clearTimeout(timer); box.classList.remove('show');
    });
  }

  // bfcache থেকে ফিরলে টাইমার থামানো
  window.addEventListener('pageshow',function(e){if(e.persisted&&timer){clearTimeout(timer);document.getElementById('auto').classList.remove('show')}});
})();
</script>
</body>
</html>
