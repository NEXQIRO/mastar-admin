<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>USER ADMINISTRATOR | NP TOURNAMENT BD</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="./firebase-config.js"></script>
<style>
:root{
  --bg:#0A0A0A;--card:#151310;--in:#1D1A14;--bd:#2E281C;
  --gold:#F59E0B;--bg2:#B97800;--tx:#F5EFE0;--mu:#A89F8A;
  --ok:#10B981;--er:#EF4444;--warn:#F59E0B;--info:#3B82F6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Hind Siliguri',sans-serif;font-size:14px;min-height:100vh}
.hd{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.hd h1{flex:1;font:800 20px 'Rajdhani',sans-serif;color:var(--gold);letter-spacing:1px;display:flex;align-items:center;gap:8px}
.hd-user{font-size:13px;color:var(--mu);display:flex;align-items:center;gap:6px}
.bal{border:1px solid var(--bg2);background:var(--in);color:var(--gold);border-radius:99px;padding:5px 16px;font:700 16px 'Rajdhani',sans-serif;display:flex;align-items:center;gap:6px}
.w{max-width:1180px;margin:0 auto;padding:16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:16px}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;position:relative;overflow:hidden}
.cd b{display:block;font:700 24px 'Rajdhani',sans-serif;color:var(--gold);margin-top:4px}
.cd span{color:var(--mu);font-size:12px;font-weight:600}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;border-bottom:1px solid var(--bd);padding-bottom:12px}
button,input,textarea,select{font-family:inherit;font-size:14px}
button{border:1px solid var(--bg2);background:var(--in);color:var(--gold);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px}
button:hover{filter:brightness(1.15)}
button.on,button.p{background:var(--gold);color:#0A0A0A;border-color:var(--gold)}
button.d{color:var(--er);border-color:#6b2a2a;background:rgba(239,68,68,0.08)}
button.d:hover{background:rgba(239,68,68,0.2)}
button.s{color:var(--ok);border-color:#1f5b35;background:rgba(16,185,129,0.08)}
button.s:hover{background:rgba(16,185,129,0.2)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{height:42px;background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:0 12px;color:var(--tx);width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.row input,.row select{flex:1;min-width:160px}
.sc{overflow-x:auto;border-radius:12px;border:1px solid var(--bd);background:var(--card)}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--bd)}
th{color:var(--mu);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;background:rgba(0,0,0,0.25)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(245,158,11,0.02)}
.pl{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;display:inline-block}
.pl.ok{border:1px solid #1f5b35;color:var(--ok);background:rgba(16,185,129,0.1)}
.pl.er{border:1px solid #6b2a2a;color:var(--er);background:rgba(239,68,68,0.1)}
.pl.warn{border:1px solid var(--bg2);color:var(--gold);background:rgba(245,158,11,0.1)}
.pl.info{border:1px solid #1e3a8a;color:#60A5FA;background:rgba(59,130,246,0.1)}
.sw{width:46px;height:24px;padding:0;border-radius:99px;position:relative;background:#3a1f1f;border:1px solid #6b2a2a;vertical-align:middle;cursor:pointer}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--er);transition:.2s}
.sw.ok{background:#143d25;border-color:#1f5b35}
.sw.ok::after{left:24px;background:var(--ok)}
.progress-bar-bg{height:8px;background:rgba(255,255,255,0.1);border-radius:99px;overflow:hidden;margin-top:6px}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--ok));border-radius:99px;transition:width .3s}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}
#login .cd{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,0.6)}
#login h1{font:800 24px 'Rajdhani',sans-serif;color:var(--gold);text-align:center}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1f1b13;border:1px solid var(--gold);color:var(--tx);padding:10px 20px;border-radius:12px;display:none;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,0.8);font-weight:600}
.notice-box{padding:12px 16px;border-radius:12px;margin-bottom:14px;border:1px solid var(--bd);background:rgba(245,158,11,0.06);color:var(--tx);font-size:13px;line-height:1.6}
.badge-count{background:var(--gold);color:#000;font-weight:800;font-size:11px;padding:1px 7px;border-radius:99px;margin-left:4px}
</style>
</head>
<body>

<div id="login">
  <div class="cd">
    <h1>USER ADMINISTRATOR</h1>
    <div style="font-size:12px;color:var(--mu);text-align:center;margin-bottom:6px">আপনার অনুমোদিত অ্যাডমিন ইমেইল ও পাসওয়ার্ড দিন</div>
    <input id="em" type="email" placeholder="অ্যাডমিন ইমেইল" autocomplete="email">
    <input id="pw" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password">
    <button class="p" style="justify-content:center;margin-top:6px" onclick="adminLogin()">লগইন করুন</button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="hd">
    <h1>🛡️ USER ADMIN PANEL</h1>
    <div class="hd-user">
      <span id="admEmail">admin@example.com</span>
      <span class="pl ok" id="admStatus">সক্রিয়</span>
    </div>
    <div class="bal" title="আপনার অ্যাডমিন ব্যালেন্স">
      <span>৳</span> <span id="admBal">0</span>
    </div>
    <button class="d" onclick="auth.signOut()">লগআউট</button>
  </div>

  <div class="w">
    <div class="g">
      <div class="cd">
        <span>পেন্ডিং ডিপোজিট</span>
        <b id="s_pend">0</b>
      </div>
      <div class="cd">
        <span>সক্রিয় প্রমোশন অফার</span>
        <b id="s_promos">0</b>
      </div>
      <div class="cd">
        <span>টার্নওভার সক্রিয় প্লেয়ার</span>
        <b id="s_turnover_active">0</b>
      </div>
      <div class="cd">
        <span>আজকের অনুমোদিত ডিপোজিট</span>
        <b id="s_today_approved">৳ 0</b>
      </div>
    </div>

    <div class="tabs">
      <button id="t-dep" onclick="tab('dep')">📥 ডিপোজিট রিকোয়েস্ট <span class="badge-count" id="b_dep">0</span></button>
      <button id="t-promos" onclick="tab('promos')">🎁 ডিপোজিট প্রমোশন</button>
      <button id="t-players" onclick="tab('players')">👥 প্লেয়ার ও টার্নওভার</button>
      <button id="t-wd" onclick="tab('wd')">📤 উইথড্র রিকোয়েস্ট <span class="badge-count" id="b_wd">0</span></button>
      <button id="t-wallet" onclick="tab('wallet')">💳 অ্যাডমিন ওয়ালেট</button>
    </div>

    <div id="v"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const MAINCFG = window.NP_FIREBASE_CONFIG || {};
const app = firebase.initializeApp(MAINCFG);
const auth = app.auth();
const db = app.database();
const TS = firebase.database.ServerValue.TIMESTAMP;

const $ = id => document.getElementById(id);
const fmt = n => '৳ ' + Math.round(n || 0).toLocaleString('en-US');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let curTab = 'dep';
let myUid = null;
let myAdminData = {};
let PROMOS = {};
let OVERRIDES = {};
let DEPOSITS = {};
let WITHDRAWALS = {};
let USERS = {};
let GLOBAL_FEATURES = {};
let USER_ADMIN_ON = true;
let searchQ = '';

function toast(m) {
  const t = $('toast');
  t.textContent = m;
  t.style.display = 'block';
  clearTimeout(t._t);
  t._t = setTimeout(() => t.style.display = 'none', 3500);
}

async function adminLogin() {
  const em = $('em').value.trim();
  const pw = $('pw').value;
  if (!em || !pw) { toast('ইমেইল ও পাসওয়ার্ড দিন'); return; }
  try {
    await auth.signInWithEmailAndPassword(em, pw);
  } catch (e) {
    toast('লগইন ব্যর্থ: ' + e.message);
  }
}

auth.onAuthStateChanged(async user => {
  if (!user) {
    $('login').style.display = 'flex';
    $('app').style.display = 'none';
    myUid = null;
    return;
  }

  myUid = user.uid;
  // Verify Admin Access in RTDB
  const admSnap = await db.ref('admins/' + myUid).once('value').catch(() => null);
  const admVal = admSnap ? admSnap.val() : null;

  if (!admVal && user.email !== 'mijanbabu2015@gmail.com') {
    toast('আপনার অ্যাকাউন্টে User Admin অনুমতি নেই!');
    await auth.signOut();
    return;
  }

  // Check Master Switch
  const uaOnSnap = await db.ref('adminSettings/userAdminOn').once('value').catch(() => null);
  if (uaOnSnap && uaOnSnap.val() === false && user.email !== 'mijanbabu2015@gmail.com') {
    toast('Super Admin কর্তৃক User Admin সাইড সাময়িক বন্ধ রাখা হয়েছে');
    await auth.signOut();
    return;
  }

  $('login').style.display = 'none';
  $('app').style.display = 'block';
  $('admEmail').textContent = user.email;

  attachListeners();
});

function attachListeners() {
  // My Admin Record
  db.ref('admins/' + myUid).on('value', snap => {
    myAdminData = snap.val() || {};
    $('admBal').textContent = Math.round(myAdminData.balance || 0).toLocaleString();
    if (myAdminData.active === false && auth.currentUser.email !== 'mijanbabu2015@gmail.com') {
      alert('আপনার অ্যাডমিন অ্যাকাউন্ট নিষ্ক্রিয় করা হয়েছে');
      auth.signOut();
      return;
    }
    OVERRIDES = myAdminData.promotionOverrides || {};
    draw();
  });

  // Global Features
  db.ref('adminFeatures').on('value', snap => {
    GLOBAL_FEATURES = snap.val() || {};
    draw();
  });

  // Master Switch
  db.ref('adminSettings/userAdminOn').on('value', snap => {
    USER_ADMIN_ON = snap.val() !== false;
    if (!USER_ADMIN_ON && auth.currentUser && auth.currentUser.email !== 'mijanbabu2015@gmail.com') {
      alert('Super Admin কর্তৃক User Admin সাইড বন্ধ করা হয়েছে');
      auth.signOut();
    }
  });

  // Deposit Promotions (Created by Super Admin)
  db.ref('depositPromotions').on('value', snap => {
    PROMOS = snap.val() || {};
    draw();
  });

  // Deposit Requests
  db.ref('depositRequests').limitToLast(150).on('value', snap => {
    DEPOSITS = snap.val() || {};
    draw();
  });

  // Withdrawal Requests
  db.ref('withdrawalRequests').limitToLast(100).on('value', snap => {
    WITHDRAWALS = snap.val() || {};
    draw();
  });

  // Users
  db.ref('users').limitToLast(300).on('value', snap => {
    USERS = snap.val() || {};
    draw();
  });
}

function hasPermission(perm) {
  // Super admin email bypass
  if (auth.currentUser && auth.currentUser.email === 'mijanbabu2015@gmail.com') return true;
  // Global feature switch check
  if (GLOBAL_FEATURES[perm] === false) return false;
  // Admin specific feature check
  const myFeat = myAdminData.features || {};
  return myFeat[perm] !== false;
}

function tab(t) {
  curTab = t;
  ['dep', 'promos', 'players', 'wd', 'wallet'].forEach(k => {
    const btn = $('t-' + k);
    if (btn) btn.className = (k === t) ? 'on' : '';
  });
  draw();
}

// Atomic Approve Deposit with Duplicate Prevention & Turnover Setup
async function approveDeposit(reqId) {
  if (!hasPermission('dep')) {
    toast('আপনার ডিপোজিট অনুমোদনের অনুমতি নেই!');
    return;
  }

  const req = DEPOSITS[reqId];
  if (!req) { toast('রিকোয়েস্ট পাওয়া যায়নি'); return; }
  if (req.status !== 'Pending') {
    toast('এই রিকোয়েস্ট ইতিমধ্যে নিষ্পন্ন করা হয়েছে (' + req.status + ')');
    return;
  }

  const userUid = req.uid;
  const user = USERS[userUid];
  if (!user) { toast('প্লেয়ার ডেটা পাওয়া যায়নি'); return; }

  const depAmt = parseFloat(req.amount) || 0;
  const bonusAmt = parseFloat(req.bonusAmount) || 0;
  const totalCredit = depAmt + bonusAmt;
  const turnoverTarget = parseFloat(req.turnoverTarget) || 0;
  const promoName = req.promotionName || 'ডিপোজিট বোনাস';

  const confirmMsg = `ডিপোজিট অনুমোদন করবেন?\n` +
    `প্লেয়ার: ${req.userName || user.name || userUid}\n` +
    `ডিপোজিট পরিমাণ: ৳${depAmt}\n` +
    (bonusAmt > 0 ? `🎁 বোনাস যোগ হবে: +৳${bonusAmt} (${promoName})\n` : '') +
    (turnoverTarget > 0 ? `🎯 নতুন পেন্ডিং টার্নওভার: ৳${turnoverTarget}\n` : '') +
    `মোট ব্যালেন্স ক্রেডিট: ৳${totalCredit}`;

  if (!confirm(confirmMsg)) return;

  try {
    // 1. Atomic Status Check to prevent duplicate approvals
    let statusCommitted = false;
    await db.ref(`depositRequests/${reqId}`).transaction(current => {
      if (!current) return current;
      if (current.status !== 'Pending') {
        return undefined; // Abort
      }
      current.status = 'Approved';
      current.approvedBy = auth.currentUser.email;
      current.approvedByUid = myUid;
      current.approvedAt = TS;
      statusCommitted = true;
      return current;
    });

    if (!statusCommitted) {
      toast('সতর্কতা: এই রিকোয়েস্ট আগেই অনুমোদন বা বাতিল হয়েছে! ডুপ্লিকেট অনুমোদন প্রতিরোধ করা হলো।');
      return;
    }

    // 2. Credit User Balance, Bonus & Initialize Pending Turnover
    const userRef = db.ref(`users/${userUid}`);
    await userRef.transaction(u => {
      if (!u) return u;
      const curBal = parseFloat(u.balance) || 0;
      const curBonus = parseFloat(u.bonusAmount) || 0;
      const curPending = parseFloat(u.turnoverPending) || 0;
      const curRemaining = parseFloat(u.turnoverRemaining) || 0;
      const curRequired = parseFloat(u.turnoverRequired) || 0;

      u.balance = curBal + totalCredit;
      if (bonusAmt > 0) {
        u.bonusAmount = curBonus + bonusAmt;
      }

      if (turnoverTarget > 0) {
        u.turnoverPending = curPending + turnoverTarget;
        u.turnoverRemaining = curRemaining + turnoverTarget;
        u.turnoverRequired = curRequired + turnoverTarget;
        if (!u.turnoverStatus || u.turnoverStatus === 'NONE' || u.turnoverStatus === 'COMPLETED') {
          u.turnoverStatus = 'PENDING';
        }
        if (req.promotionId) u.activePromotionId = req.promotionId;
        if (req.promotionName) u.activePromotionName = req.promotionName;
      }

      return u;
    });

    // 3. Record User Transaction
    const txKey = db.ref('transactions').push().key;
    await db.ref(`transactions/${txKey}`).set({
      trxId: txKey,
      uid: userUid,
      type: 'DEPOSIT',
      amount: totalCredit,
      depositAmount: depAmt,
      bonusAmount: bonusAmt,
      promotionName: promoName,
      status: 'Completed',
      adminEmail: auth.currentUser.email,
      date: new Date().toLocaleString('bn-BD'),
      timestamp: TS,
      note: `Deposit ৳${depAmt}` + (bonusAmt > 0 ? ` + ৳${bonusAmt} Bonus (${promoName})` : '')
    });

    // 4. Audit Log
    await db.ref('adminAuditLogs').push({
      admin: auth.currentUser.email,
      adminUid: myUid,
      action: 'APPROVE_DEPOSIT',
      target: userUid,
      details: `Deposit: ৳${depAmt}, Bonus: ৳${bonusAmt}, TurnoverTarget: ৳${turnoverTarget}, Request: ${reqId}`,
      timestamp: Date.now()
    }).catch(() => {});

    toast('✅ ডিপোজিট ও বোনাস সফলভাবে অনুমোদন হয়েছে!');
    draw();
  } catch (err) {
    toast('অনুমোদন ব্যর্থ: ' + err.message);
  }
}

// Reject Deposit Request
async function rejectDeposit(reqId) {
  if (!hasPermission('dep')) {
    toast('আপনার ডিপোজিট বাতিলের অনুমতি নেই!');
    return;
  }

  const req = DEPOSITS[reqId];
  if (!req) return;
  if (req.status !== 'Pending') {
    toast('এই রিকোয়েস্ট পেন্ডিং নেই!');
    return;
  }

  const reason = prompt('বাতিলের কারণ লিখুন (যেমন: ভুল TrxID / টাকা আসেনি):', 'ভুল TrxID বা টাকা পাওয়া যায়নি');
  if (reason === null) return;

  try {
    let statusCommitted = false;
    await db.ref(`depositRequests/${reqId}`).transaction(current => {
      if (!current || current.status !== 'Pending') return undefined;
      current.status = 'Rejected';
      current.rejectReason = reason;
      current.rejectedBy = auth.currentUser.email;
      current.rejectedByUid = myUid;
      current.rejectedAt = TS;
      statusCommitted = true;
      return current;
    });

    if (!statusCommitted) {
      toast('রিকোয়েস্টটি ইতিমধ্যে পরিবর্তিত হয়েছে!');
      return;
    }

    await db.ref('adminAuditLogs').push({
      admin: auth.currentUser.email,
      adminUid: myUid,
      action: 'REJECT_DEPOSIT',
      target: req.uid,
      details: `Amount: ৳${req.amount}, Reason: ${reason}, Request: ${reqId}`,
      timestamp: Date.now()
    }).catch(() => {});

    toast('ডিপোজিট রিকোয়েস্ট বাতিল করা হয়েছে ❌');
    draw();
  } catch (err) {
    toast('বাতিল ব্যর্থ: ' + err.message);
  }
}

// User Admin Promotion Override (Enable / Disable for assigned players)
async function togglePromoOverride(promoId) {
  if (!hasPermission('dep_bonus')) {
    toast('আপনার প্রমোশন নিয়ন্ত্রণ করার অনুমতি নেই!');
    return;
  }

  const curState = OVERRIDES[promoId] && OVERRIDES[promoId].enabled !== false;
  const newState = !curState;

  try {
    await db.ref(`admins/${myUid}/promotionOverrides/${promoId}`).set({
      enabled: newState,
      updatedAt: TS
    });

    await db.ref('adminAuditLogs').push({
      admin: auth.currentUser.email,
      adminUid: myUid,
      action: 'OVERRIDE_PROMOTION',
      target: promoId,
      details: `Enabled=${newState}`,

  } catch (e) {
    toast('ব্যর্থ: ' + e.message);
  }
}

// Approve Withdrawal Request
async function approveWithdrawal(reqId) {
  if (!hasPermission('wd')) {
    toast('আপনার উইথড্র অনুমোদনের অনুমতি নেই!');
    return;
  }

  const req = WITHDRAWALS[reqId];
  if (!req || req.status !== 'Pending') {
    toast('রিকোয়েস্ট পেন্ডিং নেই');
    return;
  }

  const user = USERS[req.uid] || {};
  const remTurnover = parseFloat(user.turnoverRemaining) || 0;
  if (remTurnover > 0) {
    if (!confirm(`⚠️ সতর্কবার্তা!\nএই প্লেয়ারের এখনও ৳${remTurnover} টার্নওভার বাকি আছে।\n\nআপনি কি নিশ্চিত যে টার্নওভার অসম্পূর্ণ থাকা সত্ত্বেও উইথড্র অনুমোদন করবেন?`)) {
      return;
    }
  } else {
    if (!confirm(`৳${req.amount} উইথড্র অনুমোদন করবেন?\nপ্লেয়ার: ${req.userName || req.uid}\nনম্বর: ${req.number} (${req.method})`)) return;
  }

  try {
    await db.ref(`withdrawalRequests/${reqId}`).update({
      status: 'Approved',
      approvedBy: auth.currentUser.email,
      approvedAt: TS
    });

    toast('উইথড্র অনুমোদন সফল হয়েছে ✅');
    draw();
  } catch (e) {
    toast('ব্যর্থ: ' + e.message);
  }
}

// Reject Withdrawal Request (Refunds balance)
async function rejectWithdrawal(reqId) {
  if (!hasPermission('wd')) {
    toast('আপনার উইথড্র বাতিলের অনুমতি নেই!');
    return;
  }

  const req = WITHDRAWALS[reqId];
  if (!req || req.status !== 'Pending') { toast('রিকোয়েস্ট পেন্ডিং নেই'); return; }

  const reason = prompt('বাতিলের কারণ লিখুন:', 'ভুল নম্বর / অসম্পূর্ণ টার্নওভার');
  if (reason === null) return;

  try {
    // Refund user balance
    const amt = parseFloat(req.amount) || 0;
    await db.ref(`users/${req.uid}/balance`).transaction(b => (b || 0) + amt);

    await db.ref(`withdrawalRequests/${reqId}`).update({
      status: 'Rejected',
      rejectReason: reason,
      rejectedBy: auth.currentUser.email,
      rejectedAt: TS
    });

    toast('উইথড্র বাতিল এবং ব্যালেন্স রিফান্ড সম্পন্ন ❌');
    draw();
  } catch (e) {
    toast('ব্যর্থ: ' + e.message);
  }
}

// Request balance from Super Admin
async function reqMasterBalance() {
  const amt = parseFloat(prompt('কত টাকা ব্যালেন্স রিকোয়েস্ট পাঠাবেন? (সর্বনিম্ন ১০০ টাকা):', '1000'));
  if (isNaN(amt) || amt < 100) { toast('সঠিক পরিমাণ দিন'); return; }
  const note = prompt('নোট/কারণ:', 'ডিপোজিট রিচার্জ') || '';

  try {
    const k = db.ref('balanceRequests').push().key;
    await db.ref(`balanceRequests/${k}`).set({
      id: k,
      uid: myUid,
      email: auth.currentUser.email,
      name: myAdminData.name || auth.currentUser.email,
      amount: amt,
      note: note,
      status: 'pending',
      createdAt: TS
    });
    toast('Super Admin-এর কাছে ব্যালেন্স রিকোয়েস্ট পাঠানো হয়েছে ✅');
  } catch (e) {
    toast('ব্যর্থ: ' + e.message);
  }
}

              </tr>
            `;
          }).join('') : `<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--mu)">কোনো উইথড্র রিকোয়েস্ট নেই</td></tr>`}
        </table>
      </div>
    `;
  }

  // 5. ADMIN WALLET TAB
  if (curTab === 'wallet') {
    h = `
      <div class="cd" style="margin-bottom:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
          <div>
            <span>আপনার বর্তমান অ্যাডমিন ব্যালেন্স</span>
            <b style="font-size:32px">${fmt(myAdminData.balance || 0)}</b>
          </div>
          <button class="p" onclick="reqMasterBalance()">+ Master-এর কাছে ব্যালেন্স রিকোয়েস্ট</button>
        </div>
      </div>
      <div class="notice-box">
        💡 অ্যাডমিন ব্যালেন্স কম থাকলে Super Admin-এর কাছে ব্যালেন্স রিকোয়েস্ট পাঠান। Super Admin অনুমোদন করলে তাৎক্ষণিক আপনার ব্যালেন্সে যোগ হবে।
      </div>
    `;
  }

  $('v').innerHTML = h;
}
</script>
</body>
</html>
